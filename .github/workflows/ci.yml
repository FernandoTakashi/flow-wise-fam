name: CI

# Roda em todo push e PR, pra qualquer branch — inclusive as de staging/QA.
# Não faz deploy nem toca em nenhum ambiente; só garante que o que chega no
# Vercel (Preview ou Production) já passou nos mesmos checks manuais que
# rodamos até aqui.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck (app)
        run: npm run typecheck

      - name: Typecheck (api)
        run: npm run typecheck:api

      - name: Testes (vitest)
        run: npm run test

      - name: Lint
        run: npx eslint src/

      - name: Build
        run: npm run build
